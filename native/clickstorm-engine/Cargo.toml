[package]
name = "clickstorm-engine"
version = "4.4.0"
edition = "2021"
description = "Native click engine for ClickStorm: paced SendInput and posted-message delivery"
license = "MIT"

[lib]
name = "clickstorm_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
