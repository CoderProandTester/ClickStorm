name: Windows installers

# Builds one installer per Windows architecture and publishes them to a GitHub
# Release whenever main moves to a new version. main is the only branch that
# publishes, so no release branches are created: bump clickstorm/__init__.py,
# push main, and the workflow creates the v<version> tag and attaches the
# installers plus the standalone gauntlet.py script. A version that is already
# released is left untouched, so ordinary main pushes do not republish it.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release for the version in clickstorm/__init__.py"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-installers-${{ github.ref }}
  # Never cancel a run: a main push may be mid-publish and cancelling it would
  # leave a half-populated release. Newer runs queue behind it instead.
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # The ARM64 runner is limited availability; a failed ARM64 leg must not
    # keep the x64/x86 installers from being published.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x64 and x86 share the x64 runner; the x86 job uses 32-bit Python.
          - arch: x64
            os: windows-latest
            python-arch: x64
            experimental: false
          - arch: x86
            os: windows-latest
            python-arch: x86
            experimental: false
          # Native ARM64 build on GitHub's Windows 11 ARM runner.
          - arch: arm64
            os: windows-11-arm
            python-arch: arm64
            experimental: true
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: ${{ matrix.python-arch }}

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $version = python -c "import clickstorm; print(clickstorm.__version__)"
          if (-not $version) { throw "Could not read the ClickStorm version" }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building ClickStorm $version for ${{ matrix.arch }}"

      - name: Check tag matches app version
        shell: pwsh
        run: |
          $expected = "v${{ steps.version.outputs.version }}"
          $subject = "${{ github.ref_name }}"
          if ("${{ github.ref_type }}" -eq "tag") {
            if ($subject -ne $expected) {
              throw "Tag '$subject' does not match the app version '$expected'. Bump clickstorm/__init__.py or retag."
            }
            Write-Host "Tag $subject matches the app version"
          } else {
            Write-Host "Branch $subject publishes v$($expected.TrimStart('v'))"
          }

      - name: Build the app
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check "pyinstaller>=6.10,<7"
          python -m PyInstaller --noconfirm --clean AutoClicker.spec

      - name: Verify exe architecture
        shell: pwsh
        run: |
          $machine = python -c "import struct; f = open('dist/ClickStorm.exe','rb'); d = f.read(1024); e = struct.unpack_from('<I', d, 0x3c)[0]; f.seek(e + 4); print(hex(struct.unpack('<H', f.read(2))[0]))"
          $expected = @{ x64 = '0x8664'; x86 = '0x14c'; arm64 = '0xaa64' }['${{ matrix.arch }}']
          if ($machine.Trim().ToLower() -ne $expected) {
            throw "Built exe architecture $machine does not match ${{ matrix.arch }} ($expected)"
          }
          Write-Host "Verified ${{ matrix.arch }} exe ($machine)"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "innosetup.exe"
          $target = Join-Path $env:RUNNER_TEMP "InnoSetup"
          # Official compiler build hosted on the Inno Setup GitHub releases;
          # the jrsoftware.org file URLs are not reachable from CI runners.
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          curl.exe -fsSL $url -o $installer
          Start-Process $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/CURRENTUSER", "/DIR=`"$target`"" -Wait
          $iscc = Join-Path $target "ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler was not installed" }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Build the installer
        shell: pwsh
        run: |
          & "$env:ISCC" "/DMyAppArch=${{ matrix.arch }}" "/DMyAppVersion=${{ steps.version.outputs.version }}" "installer\ClickStorm.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          $setup = "release\ClickStorm-Setup-${{ steps.version.outputs.version }}-${{ matrix.arch }}.exe"
          if (-not (Test-Path $setup)) { throw "Installer was not produced: $setup" }
          Write-Host "Built $setup"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ClickStorm-${{ matrix.arch }}
          path: release/*.exe
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    # Publish for a push to main, a v* tag push, or a manual run with
    # "publish" enabled. Always runs even when one build leg failed (that is
    # why the verify step below insists on at least one installer).
    if: |
      always() && !cancelled() &&
      (github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/tags/') ||
       (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: |
          version=$(python3 -c "import clickstorm; print(clickstorm.__version__)")
          if [ -z "$version" ]; then
            echo "Could not read the ClickStorm version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing v$version"

      - name: Check whether this version is already released
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" \
               --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v${{ steps.version.outputs.version }} is already published; "
            echo "bump clickstorm/__init__.py and gauntlet.py to publish again."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Stage the standalone Gauntlet script
        run: |
          cp gauntlet.py "release/Gauntlet-${{ steps.version.outputs.version }}.py"

      - name: Verify installers
        run: |
          count=$(find release -maxdepth 1 -name '*.exe' | wc -l)
          echo "Found $count installer(s):"
          ls -l release
          if [ "$count" -eq 0 ]; then
            echo "No installer was built, so there is nothing to publish." >&2
            exit 1
          fi
          test -f "release/Gauntlet-${{ steps.version.outputs.version }}.py"

      - name: Create GitHub release
        if: steps.existing.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          # Creating the tag here is what lets a manual run publish without
          # anyone pushing a tag from their own machine.
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.version.outputs.version }}
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
